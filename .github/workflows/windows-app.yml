name: Build Windows Desktop App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "hangar-checklists.js"
      - "main.js"
      - "package.json"
      - ".github/workflows/windows-app.yml"
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
